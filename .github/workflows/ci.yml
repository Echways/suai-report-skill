name: ci

on:
  push:
    branches: ["**"]   # tags are checked by release.yml, which calls this workflow
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # Mondays: has the skill drifted from the latest suai-report

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Plugin manifests, SKILL.md, evals.json and script style; no TeX needed
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ruff
        run: pipx run ruff check --target-version py310 --output-format=github .

      - name: Manifests and skill
        run: python3 .github/scripts/check_repo.py

  # check_report.py reads the demo report's main.tex on the oldest and newest
  # supported Python; there is no build, so the log is not checked
  script:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Echways/suai-report
          path: suai-report
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python skills/suai-report/scripts/check_report.py suai-report/docs/demo

  # The real package from main: the demo report is built with the same
  # suai build the user runs, and check_report.py finds no errors in it
  pdf:
    needs: [lint, script]
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Echways/suai-report
          path: suai-report

      - name: Python
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)

      - name: Build the demo report
        run: python3 suai-report/scripts/suai.py build suai-report/docs/demo

      - name: The built report has no errors
        run: python3 skills/suai-report/scripts/check_report.py suai-report/docs/demo

      # otherwise a script that always says "no issues" would pass
      - name: A broken reference is caught
        run: |
          sed -i 's/^\\end{document}/\\figref{ci-no-such-figure}\n&/' suai-report/docs/demo/main.tex
          code=0
          python3 skills/suai-report/scripts/check_report.py suai-report/docs/demo || code=$?
          test "$code" -eq 1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: demo-log
          if-no-files-found: ignore
          path: suai-report/docs/demo/build/main.log
