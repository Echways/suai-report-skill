name: release

# Tag vX.Y.Z (bump version in plugin.json, git tag vX.Y.Z, git push --tags):
#   the tag matches version → the ci.yml checks → a GitHub Release
#   with notes generated from the commits.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version
        run: python3 .github/scripts/check_repo.py --tag "$GITHUB_REF_NAME"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
